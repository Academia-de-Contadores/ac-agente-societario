name: Validate agent repository
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: bash tests/validate-agent-repo.test.sh
      - run: bash scripts/validate-agent-repo.sh
